<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neo Market</title>
  <meta name="description" content="Neo Market — a warm, modern storefront.">
  <style>
    :root {
      --bg: #f5efe6;
      --surface: #fffaf3;
      --surface-2: #eee3d4;
      --text: #2e241d;
      --muted: #75685c;
      --accent: #8b5e3c;
      --accent-dark: #68442b;
      --border: #ddcfbd;
      --success: #55734c;
      --danger: #9b4b3e;
      --shadow: 0 16px 40px rgba(65, 43, 25, .09);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    h1, h2, h3, h4 {
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.15;
      margin: 0;
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    a { color: inherit; text-decoration: none; }

    .container {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(245, 239, 230, .94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -.03em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-link {
      color: var(--muted);
      transition: color .2s ease;
    }

    .nav-link:hover { color: var(--text); }

    .cart-button {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform .2s ease, background .2s ease;
    }

    .cart-button:hover {
      transform: translateY(-2px);
      background: #fff;
    }

    .cart-count {
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: .76rem;
      font-weight: 700;
    }

    main { min-height: calc(100vh - 145px); }

    .hero {
      padding: 74px 0 52px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 34px;
      align-items: center;
    }

    .eyebrow {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .15em;
      font-size: .76rem;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .hero h1 {
      font-size: clamp(3rem, 7vw, 6rem);
      letter-spacing: -.055em;
      max-width: 800px;
    }

    .hero p {
      color: var(--muted);
      max-width: 600px;
      font-size: 1.08rem;
      margin: 22px 0 28px;
    }

    .hero-card {
      min-height: 330px;
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      background:
        linear-gradient(145deg, rgba(139, 94, 60, .25), rgba(63, 44, 30, .08)),
        url("https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1000&q=85") center/cover;
      box-shadow: var(--shadow);
    }

    .hero-card span {
      position: absolute;
      left: 22px;
      bottom: 20px;
      color: white;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.4rem;
      text-shadow: 0 2px 14px rgba(0,0,0,.35);
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      transition: transform .2s ease, background .2s ease;
    }

    .btn:hover {
      background: var(--accent-dark);
      transform: translateY(-2px);
    }

    .btn.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn.secondary:hover { background: var(--surface); }

    .section {
      padding: 30px 0 76px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .section-head h2 { font-size: 2.3rem; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
    }

    .filter {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 14px;
      transition: all .2s ease;
    }

    .filter:hover,
    .filter.active {
      background: var(--text);
      border-color: var(--text);
      color: #fff;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(65, 43, 25, .04);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .product-card:hover {
      transform: translateY(-7px);
      box-shadow: var(--shadow);
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: var(--surface-2);
    }

    .product-info { padding: 17px; }

    .product-category {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .1em;
      font-size: .68rem;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .product-name {
      font-size: 1.22rem;
      margin-bottom: 7px;
    }

    .product-description {
      color: var(--muted);
      font-size: .88rem;
      min-height: 45px;
      margin: 0 0 13px;
    }

    .product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .price {
      font-weight: 800;
      font-size: 1.05rem;
    }

    .small-btn {
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      padding: 8px 11px;
      font-size: .82rem;
      font-weight: 700;
      transition: all .2s ease;
    }

    .small-btn:hover {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    .small-btn.in-cart {
      color: var(--success);
      border-color: rgba(85,115,76,.35);
      background: rgba(85,115,76,.08);
    }

    .page {
      padding: 54px 0 80px;
    }

    .back-link {
      display: inline-block;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .back-link:hover { color: var(--text); }

    .product-detail {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 48px;
      align-items: start;
    }

    .gallery-main {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 22px;
      background: var(--surface-2);
    }

    .thumbnails {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .thumbnail {
      flex: 0 0 76px;
      height: 76px;
      border: 2px solid transparent;
      border-radius: 12px;
      overflow: hidden;
      padding: 0;
      background: none;
    }

    .thumbnail.active { border-color: var(--accent); }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-category {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .12em;
      font-weight: 800;
      font-size: .76rem;
      margin-bottom: 10px;
    }

    .detail-title {
      font-size: clamp(2.4rem, 5vw, 4.5rem);
      letter-spacing: -.04em;
    }

    .detail-price {
      font-size: 1.45rem;
      font-weight: 800;
      margin: 18px 0;
    }

    .detail-description {
      color: var(--muted);
      font-size: 1.02rem;
      margin-bottom: 26px;
    }

    .stock {
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 15px;
    }

    .purchase-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .quantity {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      overflow: hidden;
    }

    .quantity button {
      width: 38px;
      height: 42px;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 1.1rem;
    }

    .quantity span {
      min-width: 34px;
      text-align: center;
      font-weight: 800;
    }

    .cart-list {
      display: grid;
      gap: 13px;
      margin-bottom: 25px;
    }

    .cart-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px;
      display: grid;
      grid-template-columns: 82px 1fr auto;
      gap: 16px;
      align-items: center;
    }

    .cart-item img {
      width: 82px;
      height: 82px;
      border-radius: 12px;
      object-fit: cover;
    }

    .cart-item h3 { font-size: 1.15rem; }

    .cart-meta {
      color: var(--muted);
      font-size: .85rem;
      margin-top: 4px;
    }

    .cart-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .remove {
      border: 0;
      background: none;
      color: var(--danger);
      font-size: .84rem;
      padding: 5px;
    }

    .cart-summary {
      max-width: 470px;
      margin-left: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 7px 0;
      color: var(--muted);
    }

    .summary-total {
      border-top: 1px solid var(--border);
      margin-top: 10px;
      padding-top: 15px;
      color: var(--text);
      font-size: 1.18rem;
      font-weight: 800;
    }

    .empty {
      text-align: center;
      padding: 70px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .empty h2 { margin-bottom: 10px; }
    .empty p { color: var(--muted); }

    .checkout-grid {
      display: grid;
      grid-template-columns: 1fr .75fr;
      gap: 34px;
      align-items: start;
    }

    .form-card, .order-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 25px;
    }

    .form-card h1, .order-card h2 { margin-bottom: 22px; }

    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      font-size: .86rem;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .field input, .field textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: #fffdf9;
      color: var(--text);
      border-radius: 12px;
      padding: 12px 13px;
      outline: none;
      transition: border .2s ease, box-shadow .2s ease;
    }

    .field input:focus, .field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(139,94,60,.1);
    }

    .field textarea { min-height: 110px; resize: vertical; }

    .notice {
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 17px;
      display: none;
    }

    .notice.error {
      display: block;
      background: #f6e3df;
      color: var(--danger);
    }

    .success {
      text-align: center;
      padding: 80px 20px;
    }

    .success .check {
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: rgba(85,115,76,.13);
      color: var(--success);
      font-size: 1.6rem;
      font-weight: 900;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 26px 0;
      color: var(--muted);
      font-size: .85rem;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 950px) {
      .product-grid { grid-template-columns: repeat(3, 1fr); }
      .hero-grid, .product-detail, .checkout-grid { grid-template-columns: 1fr; }
      .hero-card { min-height: 280px; }
    }

    @media (max-width: 680px) {
      .container { width: min(100% - 22px, 1160px); }
      .nav-inner { min-height: 64px; }
      .nav-links { gap: 10px; }
      .nav-link.home-link { display: none; }
      .hero { padding-top: 48px; }
      .hero h1 { font-size: 3.2rem; }
      .section-head { align-items: start; flex-direction: column; }
      .product-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .product-info { padding: 13px; }
      .product-name { font-size: 1.05rem; }
      .product-description { font-size: .8rem; }
      .product-bottom { align-items: flex-end; flex-direction: column; }
      .product-bottom .small-btn { width: 100%; }
      .cart-item {
        grid-template-columns: 66px 1fr;
      }
      .cart-item img { width: 66px; height: 66px; }
      .cart-actions {
        grid-column: 1 / -1;
        justify-content: space-between;
      }
      .cart-summary { max-width: none; }
    }

    @media (max-width: 400px) {
      .product-grid { grid-template-columns: 1fr; }
      .product-image { aspect-ratio: 4 / 3; }
    }
  </style>
</head>

<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a class="brand" href="#/">Neo Market</a>
      <nav class="nav-links" aria-label="Main navigation">
        <a class="nav-link home-link" href="#/">Shop</a>
        <a class="cart-button" href="#/cart" aria-label="Open cart">
          Cart <span class="cart-count" id="cartCount">0</span>
        </a>
      </nav>
    </div>
  </header>

  <main id="app"></main>

  <footer>
    <div class="container">
      <span id="footerStoreName">Neo Market</span> · <span id="footerYear"></span>
    </div>
  </footer>

  <script>
    /* ============================================================
       NEO MARKET CONFIG
       Edit these values to customize your store.
       ============================================================ */
    const CONFIG = {
      storeName: "Neo Market",
      tagline: "Good things, thoughtfully chosen.",
      formspreeUrl: "https://formspree.io/f/xnjeeevy",
      currencySymbol: "₹"
    };

    /* ============================================================
       PRODUCTS
       Add/edit products here.
       Each product must contain:
       id, name, price, category, description, images, stock
       ============================================================ */
    const PRODUCTS = [
      {
        id: 1,

        ],
        stock: 12
      },
      {
        id: 2,
        name: "Canvas Everyday Tote",

        images: [
          "https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=900&q=85",
          "https://images.unsplash.com/photo-1590874103328-eac38a683ce7?auto=format&fit=crop&w=900&q=85"
        ],
        stock: 18
      },
      {
        id: 3,
        name: "Minimal Desk Lamp",
        price: 1899,
        category: "Home",
        description: "A compact ambient lamp that brings a soft, calm glow to your desk.",
        images: [
          "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=900&q=85",
          "https://images.unsplash.com/photo-1540932239986-30128078f3c5?auto=format&fit=crop&w=900&q=85"
        ],
        stock: 7
      },
      {
        id: 4,
        name: "Leather Card Holder",
        price: 1199,
        category: "Accessories",
        description: "A slim card holder with a timeless look and just enough room for the essentials.",
        images: [
          "https://images.unsplash.com/photo-1627123424574-724758594e93?auto=format&fit=crop&w=900&q=85",
          "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=900&q=85"
        ],
        stock: 15
      },
      {
        id: 5,
        name: "Linen Throw",
        price: 2499,
        category: "Living",
        description: "Soft textured linen for adding a relaxed, earthy layer to your space.",
        images: [
          "https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?auto=format&fit=crop&w=900&q=85",
          "https://images.unsplash.com/photo-1618220179428-22790b461013?auto=format&fit=crop&w=900&q=85"
        ],
        stock: 9
      },
      {
        id: 6,
        name: "Ceramic Vase",
        price: 1399,
        category: "Living",
        description: "A sculptural ceramic vase designed to look good with flowers or on its own.",
        images: [
          "https://images.unsplash.com/photo-1581783898377-1c85bf937427?auto=format&fit=crop&w=900&q=85",
          "https://images.unsplash.com/photo-1578500494198-246f612d3b3d?auto=format&fit=crop&w=900&q=85"
        ],
        stock: 11
      },
      {
        id: 7,
        name: "Classic Analog Watch",
        price: 3299,
        category: "Accessories",
        description: "A clean everyday watch with a restrained face and timeless proportions.",
        images: [
          "https://images.unsplash.com/photo-1524805444758-089113d48a6d?auto=format&fit=crop&w=900&q=85",
          "https://images.unsplash.com/photo-1523170335258-f5ed11844a49?auto=format&fit=crop&w=900&q=85"
        ],
        stock: 5
      },
      {
        id: 8,
        name: "Wooden Notebook",
        price: 599,
        category: "Stationery",
        description: "A tactile notebook with a natural cover for ideas, lists and daily notes.",
        images: [
          "https://images.unsplash.com/photo-1517842645767-c639042777db?auto=format&fit=crop&w=900&q=85",
          "https://images.unsplash.com/photo-1531346878377-a5be20888e57?auto=format&fit=crop&w=900&q=85"
        ],
        stock: 25
      }
    ];

    const CART_KEY = "neo_cart";
    let activeCategory = "All";
    let productQuantity = 1;
    let checkoutSubmitting = false;

    function money(value) {
      return CONFIG.currencySymbol + Number(value).toLocaleString("en-IN");
    }

    function getCart() {
      try {
        const cart = JSON.parse(localStorage.getItem(CART_KEY));
        return Array.isArray(cart) ? cart : [];
      } catch {
        return [];
      }
    }

    function saveCart(cart) {
      localStorage.setItem(CART_KEY, JSON.stringify(cart));
      updateCartCount();
    }

    function cartItemCount() {
      return getCart().reduce((total, item) => total + Number(item.quantity || 0), 0);
    }

    function updateCartCount() {
      document.getElementById("cartCount").textContent = cartItemCount();
    }

    function isInCart(productId) {
      return getCart().some(item => Number(item.id) === Number(productId));
    }

    function addToCart(productId, quantity = 1) {
      const product = PRODUCTS.find(p => Number(p.id) === Number(productId));
      if (!product || product.stock <= 0) return;

      const cart = getCart();
      const existing = cart.find(item => Number(item.id) === Number(productId));

      if (existing) {
        existing.quantity = Math.min(
          Number(existing.quantity) + Number(quantity),
          product.stock
        );
      } else {
        cart.push({
          id: product.id,
          quantity: Math.min(Number(quantity), product.stock)
        });
      }

      saveCart(cart);
      render();
    }

    function updateCartItem(productId, quantity) {
      const product = PRODUCTS.find(p => Number(p.id) === Number(productId));
      const cart = getCart();
      const item = cart.find(i => Number(i.id) === Number(productId));
      if (!product || !item) return;

      const newQuantity = Math.max(1, Math.min(Number(quantity), product.stock));
      item.quantity = newQuantity;
      saveCart(cart);
      render();
    }

    function removeFromCart(productId) {
      const cart = getCart().filter(item => Number(item.id) !== Number(productId));
      saveCart(cart);
      render();
    }

    function getCartDetailed() {
      return getCart()
        .map(item => {
          const product = PRODUCTS.find(p => Number(p.id) === Number(item.id));
          return product ? { product, quantity: Number(item.quantity) } : null;
        })
        .filter(Boolean);
    }

    function cartTotal() {
      return getCartDetailed().reduce(
        (sum, item) => sum + item.product.price * item.quantity,
        0
      );
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function productCard(product) {
      const inCart = isInCart(product.id);
      const outOfStock = product.stock <= 0;

      return `
        <article class="product-card" onclick="goToProduct(${product.id})">
          <img class="product-image" src="${escapeHtml(product.images[0])}" alt="${escapeHtml(product.name)}" loading="lazy">
          <div class="product-info">
            <div class="product-category">${escapeHtml(product.category)}</div>
            <h3 class="product-name">${escapeHtml(product.name)}</h3>
            <p class="product-description">${escapeHtml(product.description)}</p>
            <div class="product-bottom">
              <span class="price">${money(product.price)}</span>
              <button
                class="small-btn ${inCart ? "in-cart" : ""}"
                ${outOfStock ? "disabled" : ""}
                onclick="event.stopPropagation(); addToCart(${product.id})"
              >${outOfStock ? "Out of Stock" : inCart ? "In Cart ✓" : "Add to Cart"}</button>
            </div>
          </div>
        </article>
      `;
    }

    function renderHome() {
      const categories = ["All", ...new Set(PRODUCTS.map(p => p.category))];
      const filtered = activeCategory === "All"
        ? PRODUCTS
        : PRODUCTS.filter(p => p.category === activeCategory);

      document.getElementById("app").innerHTML = `
        <section class="hero">
          <div class="container hero-grid">
            <div>
              <div class="eyebrow">Welcome to ${escapeHtml(CONFIG.storeName)}</div>
              <h1>${escapeHtml(CONFIG.tagline)}</h1>
              <p>Everyday pieces with character. Browse a small collection of things made to be used, kept and enjoyed.</p>
              <a class="btn" href="#products">Explore products</a>
            </div>
            <div class="hero-card" aria-label="Neo Market collection">
              <span>Made for everyday living.</span>
            </div>
          </div>
        </section>

        <section class="section" id="products">
          <div class="container">
            <div class="section-head">
              <div>
                <div class="eyebrow">The collection</div>
                <h2>Shop the edit</h2>
              </div>
            </div>

            <div class="filters">
              ${categories.map(category => `
                <button class="filter ${activeCategory === category ? "active" : ""}" onclick="setCategory('${escapeHtml(category)}')">
                  ${escapeHtml(category)}
                </button>
              `).join("")}
            </div>

            <div class="product-grid">
              ${filtered.length
                ? filtered.map(productCard).join("")
                : `<div class="loading">No products in this category.</div>`
              }
            </div>
          </div>
        </section>
      `;
    }

    function setCategory(category) {
      activeCategory = category;
      if (location.hash !== "#/") {
        location.hash = "/";
      } else {
        renderHome();
        document.getElementById("products")?.scrollIntoView({ behavior: "smooth" });
      }
    }

    function goToProduct(id) {
      location.hash = `/product/${id}`;
    }

    function renderProduct(id) {
      const product = PRODUCTS.find(p => Number(p.id) === Number(id));

      if (!product) {
        renderNotFound();
        return;
      }

      productQuantity = 1;

      const related = PRODUCTS
        .filter(p => p.category === product.category && Number(p.id) !== Number(product.id))
        .slice(0, 4);

      document.getElementById("app").innerHTML = `
        <section class="page">
          <div class="container">
            <a href="#/" class="back-link">← Back to shop</a>

            <div class="product-detail">
              <div>
                <img id="galleryMain" class="gallery-main" src="${escapeHtml(product.images[0])}" alt="${escapeHtml(product.name)}">
                <div class="thumbnails">
                  ${product.images.map((image, index) => `
                    <button class="thumbnail ${index === 0 ? "active" : ""}" onclick="changeGalleryImage('${escapeHtml(image)}', this)">
                      <img src="${escapeHtml(image)}" alt="${escapeHtml(product.name)} view ${index + 1}">
                    </button>
                  `).join("")}
                </div>
              </div>

              <div>
                <div class="detail-category">${escapeHtml(product.category)}</div>
                <h1 class="detail-title">${escapeHtml(product.name)}</h1>
                <div class="detail-price">${money(product.price)}</div>
                <p class="detail-description">${escapeHtml(product.description)}</p>
                <div class="stock">
                  ${product.stock > 0 ? `${product.stock} available` : "Currently out of stock"}
                </div>

                <div class="purchase-row">
                  <div class="quantity">
                    <button onclick="changeProductQuantity(-1)" aria-label="Decrease quantity">−</button>
                    <span id="productQuantity">1</span>
                    <button onclick="changeProductQuantity(1)" aria-label="Increase quantity">+</button>
                  </div>
                  <button class="btn" onclick="addProductFromDetail(${product.id})" ${product.stock <= 0 ? "disabled" : ""}>
                    ${product.stock <= 0 ? "Out of Stock" : "Add to Cart"}
                  </button>
                  <a class="btn secondary" href="#/cart">View Cart</a>
                </div>
              </div>
            </div>

            ${related.length ? `
              <div class="section" style="padding-bottom:0;">
                <div class="section-head">
                  <div>
                    <div class="eyebrow">You may also like</div>
                    <h2>Related products</h2>
                  </div>
                </div>
                <div class="product-grid">
                  ${related.map(productCard).join("")}
                </div>
              </div>
            ` : ""}
          </div>
        </section>
      `;
    }

    function changeGalleryImage(image, button) {
      const main = document.getElementById("galleryMain");
      if (main) main.src = image;
      document.querySelectorAll(".thumbnail").forEach(t => t.classList.remove("active"));
      button.classList.add("active");
    }

    function changeProductQuantity(amount) {
      const productId = Number(location.hash.split("/")[2]);
      const product = PRODUCTS.find(p => Number(p.id) === productId);
      if (!product) return;

      productQuantity = Math.max(1, Math.min(product.stock, productQuantity + amount));
      const target = document.getElementById("productQuantity");
      if (target) target.textContent = productQuantity;
    }

    function addProductFromDetail(id) {
      addToCart(id, productQuantity);
      productQuantity = 1;
    }

    function renderCart() {
      const items = getCartDetailed();

      if (!items.length) {
        document.getElementById("app").innerHTML = `
          <section class="page">
            <div class="container">
              <div class="empty">
                <div class="eyebrow">Your cart</div>
                <h2>Nothing here yet.</h2>
                <p>Find something you like and it will show up here.</p>
                <a class="btn" href="#/">Continue Shopping</a>
              </div>
            </div>
          </section>
        `;
        return;
      }

      document.getElementById("app").innerHTML = `
        <section class="page">
          <div class="container">
            <div class="section-head">
              <div>
                <div class="eyebrow">Your cart</div>
                <h1>Ready when you are.</h1>
              </div>
              <a class="back-link" href="#/">← Continue shopping</a>
            </div>

            <div class="cart-list">
              ${items.map(({ product, quantity }) => `
                <div class="cart-item">
                  <img src="${escapeHtml(product.images[0])}" alt="${escapeHtml(product.name)}">
                  <div>
                    <h3>${escapeHtml(product.name)}</h3>
                    <div class="cart-meta">${escapeHtml(product.category)} · ${money(product.price)} each</div>
                  </div>
                  <div class="cart-actions">
                    <div class="quantity">
                      <button onclick="updateCartItem(${product.id}, ${quantity - 1})">−</button>
                      <span>${quantity}</span>
                      <button onclick="updateCartItem(${product.id}, ${quantity + 1})">+</button>
                    </div>
                    <strong>${money(product.price * quantity)}</strong>
                    <button class="remove" onclick="removeFromCart(${product.id})">Remove</button>
                  </div>
                </div>
              `).join("")}
            </div>

            <div class="cart-summary">
              <div class="summary-row">
                <span>Items</span>
                <span>${cartItemCount()}</span>
              </div>
              <div class="summary-row summary-total">
                <span>Total</span>
                <span>${money(cartTotal())}</span>
              </div>
              <a class="btn" href="#/checkout" style="display:block;text-align:center;margin-top:16px;">Proceed to Checkout</a>
            </div>
          </div>
        </section>
      `;
    }

    function renderCheckout() {
      const items = getCartDetailed();

      if (!items.length) {
        location.hash = "/cart";
        return;
      }

      document.getElementById("app").innerHTML = `
        <section class="page">
          <div class="container">
            <a href="#/cart" class="back-link">← Back to cart</a>

            <div class="checkout-grid">
              <form class="form-card" id="checkoutForm">
                <h1>Checkout</h1>
                <div id="formNotice" class="notice"></div>

                <div class="field">
                  <label for="name">Name *</label>
                  <input id="name" name="name" type="text" required autocomplete="name">
                </div>

                <div class="field">
                  <label for="email">Email *</label>
                  <input id="email" name="email" type="email" required autocomplete="email">
                </div>

                <div class="field">
                  <label for="phone">Phone *</label>
                  <input id="phone" name="phone" type="tel" required autocomplete="tel">
                </div>

                <div class="field">
                  <label for="address">Address *</label>
                  <textarea id="address" name="address" required autocomplete="street-address"></textarea>
                </div>

                <div class="field">
                  <label for="notes">Notes</label>
                  <textarea id="notes" name="notes" placeholder="Anything we should know?"></textarea>
                </div>

                <button class="btn" type="submit" id="submitOrder" style="width:100%;">
                  Place Order · ${money(cartTotal())}
                </button>
              </form>

              <aside class="order-card">
                <h2>Order Summary</h2>
                ${items.map(({ product, quantity }) => `
                  <div class="summary-row">
                    <span>${escapeHtml(product.name)} × ${quantity}</span>
                    <span>${money(product.price * quantity)}</span>
                  </div>
                `).join("")}
                <div class="summary-row summary-total">
                  <span>Total</span>
                  <span>${money(cartTotal())}</span>
                </div>
              </aside>
            </div>
          </div>
        </section>
      `;

      document.getElementById("checkoutForm").addEventListener("submit", submitCheckout);
    }

    async function submitCheckout(event) {
      event.preventDefault();

      if (checkoutSubmitting) return;

      const notice = document.getElementById("formNotice");
      const submitButton = document.getElementById("submitOrder");
      const form = event.currentTarget;
      const items = getCartDetailed();

      if (!items.length) {
        location.hash = "/cart";
        return;
      }

      if (!CONFIG.formspreeUrl || CONFIG.formspreeUrl.includes("PASTE_YOUR_FORMSPREE_URL")) {
        notice.textContent = "Please add your Formspree URL in CONFIG at the top of this file first.";
        notice.className = "notice error";
        return;
      }

      checkoutSubmitting = true;
      submitButton.disabled = true;
      submitButton.textContent = "Sending order…";

      const formData = new FormData(form);

      const orderItems = items.map(({ product, quantity }) => ({
        id: product.id,
        name: product.name,
        category: product.category,
        price: product.price,
        quantity,
        subtotal: product.price * quantity
      }));

      formData.append("store", CONFIG.storeName);
      formData.append("order_items", JSON.stringify(orderItems));
      formData.append("order_total", `${CONFIG.currencySymbol}${cartTotal()}`);
      formData.append("cart_quantity", String(cartItemCount()));

      try {
        const response = await fetch(CONFIG.formspreeUrl, {
          method: "POST",
          body: formData,
          headers: { "Accept": "application/json" }
        });

        // Formspree can return a successful response with different 2xx status codes.
        // Treat every 2xx response as a successful order submission.
        if (!response.ok) {
          let errorMessage = "Order submission failed.";
          try {
            const data = await response.json();
            if (data && data.errors && data.errors.length) {
              errorMessage = data.errors.map(error => error.message).join(" ");
            }
          } catch (_) {}
          throw new Error(errorMessage);
        }

        localStorage.removeItem(CART_KEY);
        updateCartCount();

        document.getElementById("app").innerHTML = `
          <section class="page">
            <div class="container">
              <div class="success">
                <div class="check">✓</div>
                <div class="eyebrow">Order received</div>
                <h1>Thanks for your order.</h1>
                <p style="color:var(--muted);">Your order has been sent successfully. Taking you back home in 3 seconds.</p>
              </div>
            </div>
          </section>
        `;

        setTimeout(() => {
          location.hash = "/";
        }, 3000);
      } catch (error) {
        console.error("Neo Market checkout error:", error);
        notice.textContent = error && error.message
          ? error.message
          : "We couldn't send the order. Please check your Formspree URL and try again.";
        notice.className = "notice error";
        submitButton.disabled = false;
        submitButton.textContent = `Place Order · ${money(cartTotal())}`;
        checkoutSubmitting = false;
      }
    }

    function renderNotFound() {
      document.getElementById("app").innerHTML = `
        <section class="page">
          <div class="container">
            <div class="empty">
              <div class="eyebrow">404</div>
              <h2>That page doesn't exist.</h2>
              <p>Let's get you back to the collection.</p>
              <a class="btn" href="#/">Back Home</a>
            </div>
          </div>
        </section>
      `;
    }

    function render() {
      updateCartCount();

      const hash = location.hash || "#/";
      const path = hash.replace(/^#/, "");

      if (path === "/" || path === "") {
        renderHome();
      } else if (path === "/cart") {
        renderCart();
      } else if (path === "/checkout") {
        renderCheckout();
      } else if (path.startsWith("/product/")) {
        renderProduct(path.split("/")[2]);
      } else {
        renderNotFound();
      }

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.getElementById("footerStoreName").textContent = CONFIG.storeName;
    document.getElementById("footerYear").textContent = new Date().getFullYear();

    window.addEventListener("hashchange", render);
    window.addEventListener("storage", updateCartCount);
    render();
  </script>
</body>
</html>
